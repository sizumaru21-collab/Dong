<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050507">

    <title>Dong — Charging Display</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!--
        DONG
        Minimal charging display
    -->

    <main id="chargingScreen" class="charging-screen">

        <!-- Top status -->
        <div class="top-status">

            <div class="charging-status">
                <span class="bolt">ϟ</span>
                <span>Charging</span>
            </div>

            <div id="batteryPercent" class="battery-percent">
                78%
            </div>

        </div>


        <!-- Main clock -->
        <section class="clock-section">

            <div id="clock" class="clock">
                09:30
            </div>

            <div id="date" class="date">
                Fri, 14 Jul
            </div>

        </section>


        <!-- Music player -->
        <section id="musicPlayer" class="music-player hidden">

            <div class="album-art">
                <div class="album-icon">♪</div>
            </div>

            <div class="music-info">

                <div id="songTitle" class="song-title">
                    Midnight Drive
                </div>

                <div id="artistName" class="artist-name">
                    Lo-Fi Vibes
                </div>

            </div>

            <div class="music-controls">

                <button id="previousButton" class="music-button">
                    ‹
                </button>

                <button id="playButton" class="music-button play-button">
                    ▶
                </button>

                <button id="nextButton" class="music-button">
                    ›
                </button>

            </div>

        </section>


        <!-- App name -->
        <div class="brand">
            Dong
        </div>

    </main>


    <!-- Small settings panel -->
    <button
        id="settingsButton"
        class="settings-button"
        aria-label="Open settings"
    >
        ⚙
    </button>


    <aside id="settingsPanel" class="settings-panel">

        <div class="settings-header">

            <h2>Dong</h2>

            <button
                id="closeSettings"
                class="close-button"
                aria-label="Close settings"
            >
                ×
            </button>

        </div>


        <div class="setting-group">

            <label>Clock Style</label>

            <div class="option-row">

                <button
                    class="option active"
                    data-clock="digital"
                >
                    Digital
                </button>

                <button
                    class="option"
                    data-clock="minimal"
                >
                    Minimal
                </button>

                <button
                    class="option"
                    data-clock="outline"
                >
                    Outline
                </button>

            </div>

        </div>


        <div class="setting-group">

            <label>Theme</label>

            <div class="option-row">

                <button
                    class="option active"
                    data-theme="amoled"
                >
                    AMOLED
                </button>

                <button
                    class="option"
                    data-theme="dark"
                >
                    Dark
                </button>

                <button
                    class="option"
                    data-theme="light"
                >
                    Light
                </button>

            </div>

        </div>


        <div class="setting-group">

            <label>24 Hour Format</label>

            <button
                id="formatToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting-group">

            <label>Show Battery</label>

            <button
                id="batteryToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting-group">

            <label>Show Date</label>

            <button
                id="dateToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="settings-footer">
            Dong · Minimal charging display
        </div>

    </aside>


    <script src="./script.js"></script>

</body>
</html>

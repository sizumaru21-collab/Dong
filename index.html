
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Dong</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="charging-screen">

    <!-- Top status -->
    <div class="top-status">
      <div class="charging-status">
        <span class="bolt">ϟ</span>
        <span>Charging</span>
      </div>

      <div class="battery">
        78%
      </div>
    </div>


    <!-- Main clock -->
    <section class="clock-section">

      <div id="clock" class="clock">
        09<br>
        30
      </div>

      <div id="date" class="date">
        Fri, 14 Jul
      </div>

    </section>


    <!-- Music player -->
    <!-- Hidden until music is playing -->
    <section id="musicPlayer" class="music-player hidden">

      <div class="album-art">
        <div class="album-glow"></div>
      </div>

      <div class="song-info">
        <div class="song-title">Midnight Drive</div>
        <div class="artist">Lo-Fi Vibes</div>
      </div>

      <div class="progress-area">
        <div class="progress-bar">
          <div class="progress"></div>
        </div>

        <div class="progress-time">
          <span>01:24</span>
          <span>03:56</span>
        </div>
      </div>

      <div class="player-controls">
        <button aria-label="Previous">‹</button>
        <button class="play-button" aria-label="Play">▶</button>
        <button aria-label="Next">›</button>
      </div>

    </section>


    <!-- Small bottom message -->
    <div class="bottom-message">
      Dong
    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>

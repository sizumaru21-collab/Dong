name: Build and Test Dong

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: dong-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"


      - name: Build Dong
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - name: Run Dong on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: |

            echo "Installing Dong..."

            adb install -r android/app/build/outputs/apk/debug/app-debug.apk

            echo "Launching Dong..."

            adb shell am start \
              -n com.dong.app/.MainActivity

            sleep 5

            echo "Checking Dong process..."

            adb shell pidof com.dong.app

            echo "Checking Dong activity..."

            adb shell dumpsys activity activities | grep "com.dong.app"

            echo "Testing simulated charging state..."

            adb shell dumpsys battery set ac 1

            sleep 2

            adb shell dumpsys battery

            echo "Dong emulator test completed."


      - name: Upload Dong APK
        uses: actions/upload-artifact@v4
        with:
          name: Dong-debug-tested
          path: android/app/build/outputs/apk/debug/*.apk

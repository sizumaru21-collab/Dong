name: Build and Test Dong

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: dong-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"


      - name: Build Dong APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug


      - name: Upload Dong APK
        uses: actions/upload-artifact@v4
        with:
          name: Dong-debug
          path: android/app/build/outputs/apk/debug/*.apk


  emulator-test:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"


      - name: Download Dong APK
        uses: actions/download-artifact@v5
        with:
          name: Dong-debug
          path: apk


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -l /dev/kvm


      - name: Run Dong on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:

          api-level: 34

          target: google_apis

          arch: x86_64

          profile: pixel_2

          cores: 2

          ram-size: 2048M

          heap-size: 512M

          disk-size: 4096M

          emulator-boot-timeout: 300

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none

          disable-animations: true

          script: |

            echo "================================="
            echo "Installing Dong"
            echo "================================="

            adb install -r apk/app-debug.apk


            echo "================================="
            echo "Launching Dong"
            echo "================================="

            adb shell am start -W \
              -n com.dong.app/.MainActivity


            echo "================================="
            echo "Waiting for Dong"
            echo "================================="

            sleep 3


            echo "================================="
            echo "Checking Dong package"
            echo "================================="

            adb shell pm list packages | grep com.dong.app


            echo "================================="
            echo "Checking Dong process"
            echo "================================="

            adb shell pidof com.dong.app || true


            echo "================================="
            echo "Checking current activity"
            echo "================================="

            adb shell dumpsys activity activities \
              | grep com.dong.app || true


            echo "================================="
            echo "Simulating charger connection"
            echo "================================="

            adb shell dumpsys battery reset

            adb shell dumpsys battery set ac 1

            sleep 3


            echo "================================="
            echo "Battery state"
            echo "================================="

            adb shell dumpsys battery


            echo "================================="
            echo "Dong test completed"
            echo "================================="
